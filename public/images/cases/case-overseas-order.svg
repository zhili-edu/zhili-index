<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">全球出海合伙人首笔海外订单案例配图</title>
  <desc id="desc">以泰达、印尼教育部合作意向和海外订单为主题的抽象案例配图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#063a6f" />
      <stop offset="0.48" stop-color="#0f766e" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" rx="80" fill="url(#bg)" />
  <circle cx="800" cy="500" r="430" fill="url(#glow)" />
  <path
    d="M250 610 C420 420 560 410 730 540 S1070 720 1350 405"
    fill="none"
    stroke="#fef3c7"
    stroke-width="18"
    stroke-linecap="round"
    stroke-dasharray="4 44"
  />
  <g fill="none" stroke="#dff7ff" stroke-opacity="0.55" stroke-width="6">
    <circle cx="800" cy="500" r="310" />
    <ellipse cx="800" cy="500" rx="470" ry="205" />
    <ellipse cx="800" cy="500" rx="170" ry="430" />
  </g>
  <g fill="#ffffff">
    <circle cx="360" cy="535" r="34" />
    <circle cx="805" cy="575" r="42" />
    <circle cx="1250" cy="480" r="34" />
  </g>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#ffffff">
    <text x="170" y="210" font-size="72" font-weight="700">全球出海合伙人计划</text>
    <text x="170" y="300" font-size="44" opacity="0.88">TEDA · Indonesia Ministry of Education</text>
    <text x="170" y="815" font-size="58" font-weight="700">首笔海外订单</text>
    <text x="170" y="885" font-size="34" opacity="0.86">官方报道背书 · 教育科技出海</text>
  </g>
  <g transform="translate(1045 725)">
